onboarding = false

[keys]
prefix = "alt+m"

# Pane Resizing
resize_pane_left = "prefix+left"
resize_pane_right = "prefix+right"
resize_pane_up = "prefix+up"
resize_pane_down = "prefix+down"

# Pane Splitting
split_horizontal = "prefix+h"

previous_tab = "prefix+m"
next_tab = "prefix+n"

# Interop Native Bindings (Correct Canonical Syntax)
zoom = "prefix+f"
focus_pane_left = "ctrl+left"
focus_pane_down = "ctrl+down"
focus_pane_up = "ctrl+up"
focus_pane_right = "ctrl+right"

close_pane = []

[[keys.command]]
key = "prefix+x"                             # or ["prefix+x", "ctrl+alt+x"], etc.
type = "plugin_action"
command = "asumaran.asconfirmclose.close"
description = "close pane (confirm if busy)"

[ui]
sidebar_start_collapsed = true
sidebar_width = 26             # default 26
status_indicators = "symbols"

# Space-Saving Layouts
pane_gaps = false         # Force panes right against each other
pane_borders = "auto"     # Keep dividers visible
pane_outer_borders = true

[theme]
name = "gruvbox" # You must declare a base theme to use custom overrides!

[theme.custom]
# Gruvbox Dark Hard Overrides
sidebar_bg = "#1d2021"
panel_bg = "#1d2021"
active_row_bg = "#3c3836"
selection_bg = "#665c54"
surface0 = "#3c3836"
surface1 = "#504945"
surface_dim = "#3c3836"
overlay0 = "#665c54"
overlay1 = "#7c6f64"
text = "#ebdbb2"
subtext0 = "#a89984"
accent = "#d79921"
yellow = "#fabd2f"
red = "#fb4934"
green = "#b8bb26"
blue = "#83a598"
mauve = "#d3869b"
teal = "#8ec07c"
peach = "#fe8019"
