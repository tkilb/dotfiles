// LibreWolf Overrides - Zen Configuration

// 1. Enable custom user stylesheets (userChrome.css / userContent.css)
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);

// 2. Enable native vertical tabs and sidebar revamp
defaultPref("sidebar.revamp", true);
defaultPref("sidebar.verticalTabs", true);

// 3. Search Engine: Set Google as default search and enable search suggestions
defaultPref("browser.search.defaultenginename", "Google");
defaultPref("browser.search.suggest.enabled", true);
defaultPref("browser.urlbar.suggest.searches", true);

// 4. Disable Resist Fingerprinting (RFP) to prevent reCAPTCHA loops & timezone issues
defaultPref("privacy.resistFingerprinting", false);
defaultPref("privacy.resistFingerprinting.letterboxing", false);

// 5. Preserve logins, cookies, and history across restarts (anti-bot / persistent session)
defaultPref("privacy.clearOnShutdown.cookies", false);
defaultPref("privacy.clearOnShutdown.history", false);
defaultPref("privacy.clearOnShutdown.sessions", false);
defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", false);
defaultPref("privacy.clearOnShutdown_v2.historyFormDataAndDownloads", false);
defaultPref("privacy.clearOnShutdown_v2.cache", false);

// 6. Homepage: Set Google as homepage and startup page
defaultPref("browser.startup.homepage", "https://www.google.com");
defaultPref("browser.startup.page", 1);

// 7. Hide alternative search engine buttons in urlbar
defaultPref("browser.urlbar.oneOffSearches", false);
