customCommands:
  - key: "<c-f>"
    context: "commits"
    description: "Flatten: replay local commits onto latest target, discarding merge commit"
    prompts:
      - type: "confirm"
        title: "Flatten history"
        body: "Select the merge-base commit (the last commit shared with your upstream, BEFORE your own local-only commits start) as the currently selected commit before confirming — do NOT select a merge commit itself.\n\nThis will discard commit {{.SelectedLocalCommit.Hash}} and everything before it, then replay only the commits after it on top of the current tip of your upstream branch (@{u}). Continue?"
    command: "git rebase --onto @{u} {{.SelectedLocalCommit.Hash}}"
    loadingText: "Flattening branch history..."
    after:
      checkForConflicts: true

  - key: "<c-x>"
    context: "localBranches, commits"
    description: "Trash History: squash all commits older than date into one root commit"
    prompts:
      - type: "input"
        title: "Trash history older than (git --since syntax, e.g. '6 months ago')"
        key: "Cutoff"
        initialValue: "6 months ago"
      - type: "confirm"
        title: "Trash history before {{.Form.Cutoff}}"
        body: "This rewrites the CURRENT branch: every commit older than '{{.Form.Cutoff}}' is squashed into a single root commit; everything at/after that date is preserved verbatim (identical file contents). It does NOT push automatically. Requires a clean working tree. If this was a mistake, recover locally via `git reflog` + `git reset --hard <sha-before>` before running gc. Continue?"
    command: >-
      bash -c 'set -euo pipefail;
      CUTOFF={{.Form.Cutoff | quote}};
      BRANCH=$(git rev-parse --abbrev-ref HEAD);
      if [ -n "$(git status --porcelain)" ]; then echo "Working tree not clean, aborting." >&2; exit 1; fi;
      KEEP_FROM=$(git log --since="$CUTOFF" --format=%H --reverse | head -1);
      if [ -z "$KEEP_FROM" ]; then echo "No commits at/after cutoff; aborting for safety." >&2; exit 1; fi;
      PARENT="${KEEP_FROM}^";
      if ! git rev-parse -q --verify "$PARENT" >/dev/null 2>&1; then echo "Already fully trashed; nothing to do."; exit 0; fi;
      NEWROOT=$(git commit-tree "${PARENT}^{tree}" -m "Squashed history before $CUTOFF");
      git rebase --onto "$NEWROOT" "$PARENT" "$BRANCH"'
    loadingText: "Trashing old history..."
    after:
      checkForConflicts: true

  - key: "<c-n>"
    context: "localBranches, commits"
    description: "New Local: DELETES local git data - branches, stashes, reflogs, etc"
    prompts:
      - type: "confirm"
        title: "Flush local git data"
        body: "This opens a terminal that previews exactly which local branches would be deleted (merged into the current branch, or whose upstream is gone) and how many stashes would be dropped, then requires typing YES to proceed. Once confirmed, it also expires the reflog and runs `git gc --prune=now`, which is IRREVERSIBLE (no reflog-based undo afterward). 'main'/'master'/'develop' and the current branch are always protected. Continue to preview?"
    command: >-
      bash -c 'set -euo pipefail;
      echo "=== Local git maintenance preview ===";
      echo;
      CURRENT=$(git rev-parse --abbrev-ref HEAD);
      PROTECTED_RE="^(main|master|develop|${CURRENT})$";
      MERGED=$(git branch --format="%(refname:short)" --merged HEAD | grep -vE "$PROTECTED_RE" || true);
      GONE=$(git branch -vv | grep ": gone\]" | sed -E "s/^[* ]+//" | cut -d" " -f1 | grep -vE "$PROTECTED_RE" || true);
      BRANCHES_TO_DELETE=$(printf "%s\n%s\n" "$MERGED" "$GONE" | grep -v "^$" | sort -u || true);
      echo "Local branches that will be deleted (merged into $CURRENT, or upstream gone):";
      if [ -n "$BRANCHES_TO_DELETE" ]; then printf "  - %s\n" $BRANCHES_TO_DELETE; else echo "  (none)"; fi;
      echo;
      STASH_COUNT=$(git stash list | wc -l | tr -d " ");
      echo "Stashes that will be dropped: $STASH_COUNT";
      echo;
      echo "Reflog entries will be expired immediately (git reflog expire --expire=now --all)";
      echo "Unreachable objects will be pruned immediately (git gc --prune=now)";
      echo;
      echo "NOTE: once reflog is expired and gc runs, none of the above is recoverable.";
      echo;
      read -r -p "Type YES (all caps) to proceed: " CONFIRM;
      if [ "$CONFIRM" != "YES" ]; then echo "Aborted, nothing changed."; exit 1; fi;
      if [ -n "$BRANCHES_TO_DELETE" ]; then while IFS= read -r b; do [ -n "$b" ] && git branch -D "$b"; done <<< "$BRANCHES_TO_DELETE"; fi;
      git stash clear;
      git reflog expire --expire=now --all;
      git gc --prune=now;
      echo;
      echo "Done.";
      read -r -p "Press enter to return to lazygit..." _ || true'
    output: terminal
    loadingText: "Flushing local git data..."
