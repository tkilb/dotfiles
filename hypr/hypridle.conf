# Hypridle configuration

general {
    # Command to run when loginctl lock-session is triggered
    lock_cmd = pidof hyprlock || hyprlock

    # Lock screen before system suspend
    before_sleep_cmd = loginctl lock-session

    # Turn display back on after waking from sleep
    after_sleep_cmd = hyprctl dispatch dpms on

    # Ignore DBus inhibition (e.g., from video players)
    ignore_dbus_inhibit = false
}

# Note: hypridle does not natively support 'condition = on-ac' syntax.
# Power detection is handled dynamically via bash logic in each listener:
# - Battery: /sys/class/power_supply/BAT*/status returns 'Discharging'
# - AC Power / Desktop: Battery is charging, full, or no battery exists.

# ============================================
# 2 Minutes (120s) - Battery: Screen off
# ============================================
listener {
    timeout = 120
    on-timeout = bash -c 'cat /sys/class/power_supply/BAT*/status 2>/dev/null | grep -q Discharging && hyprctl dispatch dpms off'
    on-resume = hyprctl dispatch dpms on
}

# ============================================
# 5 Minutes (300s) - AC: Screen off | Battery: Lock screen
# ============================================
listener {
    timeout = 300
    on-timeout = bash -c 'if cat /sys/class/power_supply/BAT*/status 2>/dev/null | grep -q Discharging; then loginctl lock-session; else hyprctl dispatch dpms off; fi'
    on-resume = hyprctl dispatch dpms on
}

# ============================================
# 15 Minutes (900s) - AC: Lock screen | Battery: Suspend
# ============================================
listener {
    timeout = 900
    on-timeout = bash -c 'if cat /sys/class/power_supply/BAT*/status 2>/dev/null | grep -q Discharging; then systemctl suspend; else loginctl lock-session; fi'
}

# ============================================
# 45 Minutes (2700s) - AC: Suspend
# ============================================
listener {
    timeout = 2700
    on-timeout = bash -c 'cat /sys/class/power_supply/BAT*/status 2>/dev/null | grep -q Discharging || systemctl suspend'
}
