onboarding = false

[keys]
prefix = "alt+m"

settings = "prefix+,"
detach = "prefix+shift+d"

# Pane Management
resize_pane_left = "prefix+left"
resize_pane_right = "prefix+right"
resize_pane_up = "prefix+up"
resize_pane_down = "prefix+down"
split_horizontal = "prefix+s"
close_pane = "prefix+x"
zoom = "prefix+f"

previous_tab = "prefix+m"
next_tab = "prefix+n"
next_agent = "prefix+a"
switch_tab = ""  # prefix+1..8 are custom commands below (see SPEC.md)

# Seamless Neovim / Herdr Navigation (herdr-nvim-nav)
[[keys.command]]
key = "ctrl+left"
type = "plugin_action"
command = "herdr-nvim-nav.left"
description = "navigate left (nvim/herdr)"

[[keys.command]]
key = "ctrl+down"
type = "plugin_action"
command = "herdr-nvim-nav.down"
description = "navigate down (nvim/herdr)"

[[keys.command]]
key = "ctrl+up"
type = "plugin_action"
command = "herdr-nvim-nav.up"
description = "navigate up (nvim/herdr)"

[[keys.command]]
key = "ctrl+right"
type = "plugin_action"
command = "herdr-nvim-nav.right"
description = "navigate right (nvim/herdr)"

# Named multi-pane tab ("the hack" — see custom-herdr-tab-hack.md at repo root)
[[keys.command]]
key = "prefix+shift+c"
type = "popup"
command = "herdr-new-tab"
description = "new named tab (vim/ai/term panes)"
width = "50%"
height = "30%"

# Broadcast a command to all panes in the current tab (herdr-synchronize-panes)
[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "synchronize-panes.broadcast"
description = "broadcast a command to all panes in this tab"

# Workspace/tab shortcuts (see SPEC.md): each focuses a workspace by number, then a tab by position (missing workspaces are created)
[[keys.command]]
key = "prefix+7"
type = "shell"
command = "c=$(herdr workspace list | jq '.result.workspaces | length'); while [ \"$c\" -lt 1 ]; do herdr workspace create --focus >/dev/null; c=$((c+1)); done; w=$(herdr workspace list | jq -r '.result.workspaces[] | select(.number==1) | .workspace_id'); herdr workspace focus \"$w\"; herdr tab list --workspace \"$w\" | jq -r '.result.tabs[0].tab_id // empty' | xargs -r herdr tab focus"
description = "focus workspace 1, tab 1"

