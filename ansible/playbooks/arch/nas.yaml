# NAS Setup Playbook for Arch Linux
#
# Usage:
#   cd ~/.dotfiles/ansible
#   NAS_USERNAME=your_user NAS_PASSWORD=your_pass ansible-playbook playbooks/arch/nas.yaml
#
# Environment variables:
#   NAS_USERNAME - Your NAS username (required)
#   NAS_PASSWORD - Your NAS password (required)
#
# This playbook:
#   - Installs cifs-utils
#   - Creates mount points /mnt/nas/d2 and /mnt/nas/d3
#   - Stores credentials securely in /etc/smb/credentials (mode 0600)
#   - Configures fstab with systemd automount entries (mounts on first access, waits for network)

---
- name: Configure NAS Mounts
  hosts: localhost
  become: true
  vars:
    nas_ip: "192.168.0.123"
    nas_username: "{{ lookup('env', 'NAS_USERNAME') }}"
    nas_password: "{{ lookup('env', 'NAS_PASSWORD') }}"
    username: "{{ ansible_user_id }}"
    user_uid: 1000
    user_gid: 1000

  tasks:
    - name: Install required packages
      pacman:
        name:
          - cifs-utils
        state: present
        update_cache: true

    - name: Create mount points
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: root
        group: root
      loop:
        - /mnt/nas
        - /mnt/nas/d2
        - /mnt/nas/d3

    - name: Create SMB credentials directory
      file:
        path: /etc/smb
        state: directory
        mode: "0700"
        owner: root
        group: root

    - name: Create SMB credentials file
      copy:
        dest: /etc/smb/credentials
        content: |
          username={{ nas_username }}
          password={{ nas_password }}
        mode: "0600"
        owner: root
        group: root
      no_log: true

    - name: Create fstab entries for NAS mounts
      lineinfile:
        path: /etc/fstab
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: true
        mode: "0644"
      loop:
        - {
            regexp: '^//{{ nas_ip }}/d2\s+',
            line: "//{{ nas_ip }}/d2  /mnt/nas/d2  cifs  credentials=/etc/smb/credentials,iocharset=utf8,file_mode=0777,dir_mode=0777,uid={{ user_uid }},gid={{ user_gid }},x-systemd.automount,_netdev  0  0",
          }
        - {
            regexp: '^//{{ nas_ip }}/d3\s+',
            line: "//{{ nas_ip }}/d3  /mnt/nas/d3  cifs  credentials=/etc/smb/credentials,iocharset=utf8,file_mode=0777,dir_mode=0777,uid={{ user_uid }},gid={{ user_gid }},x-systemd.automount,_netdev  0  0",
          }

    - name: Reload systemd daemon
      systemd:
        daemon_reload: true

    - name: Unmount legacy mount points if mounted
      command: "umount -l {{ item }}"
      loop:
        - /mnt/d2
        - /mnt/d3
      register: umount_result
      failed_when: false
      changed_when: umount_result.rc == 0

    - name: Remove legacy mount point directories
      command: "rmdir {{ item }}"
      loop:
        - /mnt/d2
        - /mnt/d3
      register: rmdir_result
      failed_when: false
      changed_when: rmdir_result.rc == 0

    - name: Enable and start remote-fs-pre target for network mounts
      systemd:
        name: remote-fs-pre.target
        enabled: true
        daemon_reload: true

    - name: Display completion message
      debug:
        msg: |
          NAS setup complete!

          Mount points created:
            - /mnt/nas/d2 -> smb://{{ nas_ip }}/d2
            - /mnt/nas/d3 -> smb://{{ nas_ip }}/d3

          To mount the shares manually:
            sudo mount /mnt/nas/d2
            sudo mount /mnt/nas/d3

          Shares will automount on first access via systemd automount units.
