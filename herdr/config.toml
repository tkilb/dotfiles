onboarding = false

[keys]
prefix = "alt+m"

settings = "prefix+,"

# Pane Management
resize_pane_left = "prefix+left"
resize_pane_right = "prefix+right"
resize_pane_up = "prefix+up"
resize_pane_down = "prefix+down"
split_horizontal = "prefix+s"
close_pane = "prefix+x"
zoom = "prefix+f"

previous_tab = "prefix+m"
next_tab = "prefix+n"
next_agent = "prefix+a"
switch_tab = ""  # prefix+1..6 are custom commands below (workspace 1 only)

# Seamless Neovim / Herdr Navigation (herdr-nvim-nav)
[[keys.command]]
key = "ctrl+left"
type = "plugin_action"
command = "herdr-nvim-nav.left"
description = "navigate left (nvim/herdr)"

[[keys.command]]
key = "ctrl+down"
type = "plugin_action"
command = "herdr-nvim-nav.down"
description = "navigate down (nvim/herdr)"

[[keys.command]]
key = "ctrl+up"
type = "plugin_action"
command = "herdr-nvim-nav.up"
description = "navigate up (nvim/herdr)"

[[keys.command]]
key = "ctrl+right"
type = "plugin_action"
command = "herdr-nvim-nav.right"
description = "navigate right (nvim/herdr)"

# Named multi-pane tab ("the hack" — see custom-herdr-tab-hack.md at repo root)
[[keys.command]]
key = "prefix+shift+c"
type = "popup"
command = "herdr-new-tab"
description = "new named tab (vim/ai/term panes)"
width = "50%"
height = "30%"

# Broadcast a command to all panes in the current tab (herdr-synchronize-panes)
[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "synchronize-panes.broadcast"
description = "broadcast a command to all panes in this tab"

# Workspace shortcuts: prefix+7/8/9 focus workspace 2/3/4, then its tab 1 (looked up by number, IDs are not positional; missing workspaces are created)
[[keys.command]]
key = "prefix+7"
type = "shell"
command = "c=$(herdr workspace list | jq '.result.workspaces | length'); while [ \"$c\" -lt 2 ]; do herdr workspace create --focus >/dev/null; c=$((c+1)); done; w=$(herdr workspace list | jq -r '.result.workspaces[] | select(.number==2) | .workspace_id'); herdr workspace focus \"$w\"; herdr tab list --workspace \"$w\" | jq -r '.result.tabs[0].tab_id // empty' | xargs -r herdr tab focus"
description = "focus workspace 2, tab 1"

[[keys.command]]
key = "prefix+8"
type = "shell"
command = "c=$(herdr workspace list | jq '.result.workspaces | length'); while [ \"$c\" -lt 3 ]; do herdr workspace create --focus >/dev/null; c=$((c+1)); done; w=$(herdr workspace list | jq -r '.result.workspaces[] | select(.number==3) | .workspace_id'); herdr workspace focus \"$w\"; herdr tab list --workspace \"$w\" | jq -r '.result.tabs[0].tab_id // empty' | xargs -r herdr tab focus"
description = "focus workspace 3, tab 1"

[[keys.command]]
key = "prefix+9"
type = "shell"
command = "c=$(herdr workspace list | jq '.result.workspaces | length'); while [ \"$c\" -lt 4 ]; do herdr workspace create --focus >/dev/null; c=$((c+1)); done; w=$(herdr workspace list | jq -r '.result.workspaces[] | select(.number==4) | .workspace_id'); herdr workspace focus \"$w\"; herdr tab list --workspace \"$w\" | jq -r '.result.tabs[0].tab_id // empty' | xargs -r herdr tab focus"
description = "focus workspace 4, tab 1"

# Tab shortcuts: prefix+1..6 focus tab 1..6 of workspace 1 (by position, from any workspace)
[[keys.command]]
key = "prefix+1"
type = "shell"
command = "herdr workspace list | jq -r '.result.workspaces[] | select(.number==1) | .workspace_id' | xargs -r -I{} herdr tab list --workspace {} | jq -r '.result.tabs[0].tab_id // empty' | xargs -r herdr tab focus"
description = "focus tab 1 in workspace 1"

[[keys.command]]
key = "prefix+2"
type = "shell"
command = "herdr workspace list | jq -r '.result.workspaces[] | select(.number==1) | .workspace_id' | xargs -r -I{} herdr tab list --workspace {} | jq -r '.result.tabs[1].tab_id // empty' | xargs -r herdr tab focus"
description = "focus tab 2 in workspace 1"

[[keys.command]]
key = "prefix+3"
type = "shell"
command = "herdr workspace list | jq -r '.result.workspaces[] | select(.number==1) | .workspace_id' | xargs -r -I{} herdr tab list --workspace {} | jq -r '.result.tabs[2].tab_id // empty' | xargs -r herdr tab focus"
description = "focus tab 3 in workspace 1"

[[keys.command]]
key = "prefix+4"
type = "shell"
command = "herdr workspace list | jq -r '.result.workspaces[] | select(.number==1) | .workspace_id' | xargs -r -I{} herdr tab list --workspace {} | jq -r '.result.tabs[3].tab_id // empty' | xargs -r herdr tab focus"
description = "focus tab 4 in workspace 1"

[[keys.command]]
key = "prefix+5"
type = "shell"
command = "herdr workspace list | jq -r '.result.workspaces[] | select(.number==1) | .workspace_id' | xargs -r -I{} herdr tab list --workspace {} | jq -r '.result.tabs[4].tab_id // empty' | xargs -r herdr tab focus"
description = "focus tab 5 in workspace 1"

[[keys.command]]
key = "prefix+6"
type = "shell"
command = "herdr workspace list | jq -r '.result.workspaces[] | select(.number==1) | .workspace_id' | xargs -r -I{} herdr tab list --workspace {} | jq -r '.result.tabs[5].tab_id // empty' | xargs -r herdr tab focus"
description = "focus tab 6 in workspace 1"

[ui]
sidebar_start_collapsed = true
sidebar_width = 26             # default 26
status_indicators = "symbols"

# Space-Saving Layouts
pane_gaps = false         # Force panes right against each other
pane_borders = "auto"     # Keep dividers visible
pane_outer_borders = true

[theme]
name = "gruvbox" # You must declare a base theme to use custom overrides!

[theme.custom]
# Gruvbox Dark Hard Overrides
sidebar_bg = "#1d2021"
panel_bg = "#1d2021"
active_row_bg = "#3c3836"
selection_bg = "#665c54"
surface0 = "#3c3836"
surface1 = "#504945"
surface_dim = "#3c3836"
overlay0 = "#665c54"
overlay1 = "#7c6f64"
text = "#ebdbb2"
subtext0 = "#a89984"
accent = "#d79921"
yellow = "#fabd2f"
red = "#fb4934"
green = "#b8bb26"
blue = "#83a598"
mauve = "#d3869b"
teal = "#8ec07c"
peach = "#fe8019"
