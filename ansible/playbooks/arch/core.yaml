---
- name: Install Core Tooling
  hosts: localhost
  become: true # Necessary to run with root privileges
  tasks:
    - name: Install wl-clipboard
      community.general.pacman:
        name: wl-clipboard
        state: present
        update_cache: true

    - name: Install NeoVim
      community.general.pacman:
        name: neovim
        state: present
        update_cache: true

    - name: Disable password lockout (pam_faillock)
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: '^(#\s*)?deny\s*=\s*'
        line: 'deny = 0'
        state: present

